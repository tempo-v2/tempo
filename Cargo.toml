# Created by tempo-v2 bootstrap; package metadata stays standalone.
[package]
name = "tempo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tempo-v2/tempo"

[dependencies]
tempo-types = "=0.1.0"
tempo-study = "=0.1.0"
tempo-queue = "=0.1.0"
tempo-learning = "=0.1.0"
tempo-chess = "=0.1.0"
tempo-store = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1.3", default-features = false }
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync", "time"] }
log = { version = "0.4", features = ["kv"] }
libc = "0.2"

[dev-dependencies]
tempfile = "=3.15.0"

[dependencies.chrono]
version = "=0.4.44"
default-features = false
features = ["std"]

[dependencies.chrono-tz]
version = "=0.10.4"

[dependencies.blake3]
version = "=1.8.3"
