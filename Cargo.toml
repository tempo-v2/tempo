[package]
name = "tempo"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["clock"] }
fsrs = "=6.6.2"
fs2 = "0.4"
pgn-reader = "=0.29.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "process", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tempfile = "3.27.0"

[workspace]
members = ["stockfish-analysis"]

[dev-dependencies]
chrono-tz = "0.10.4"
